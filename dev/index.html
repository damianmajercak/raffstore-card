<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raffstore card – dev</title>
    <style>
      :root {
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: rgba(0, 0, 0, 0.12);
        --primary-color: #03a9f4;
        --rgb-primary-color: 3, 169, 244;
        --accent-color: #ff9800;
        --success-color: #43a047;
        --rgb-success-color: 67, 160, 71;
        --warning-color: #ffa600;
        --card-background-color: #ffffff;
        --secondary-background-color: #f5f5f5;
        --page-bg: #fafafa;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(225, 225, 225, 0.12);
        --card-background-color: #1c1c1c;
        --secondary-background-color: #282828;
        --page-bg: #111111;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: Roboto, system-ui, sans-serif;
        background: var(--page-bg);
        color: var(--primary-text-color);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
        font-size: 14px;
      }
      #cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
        max-width: 1100px;
      }
      .cfg {
        font-size: 11px;
        color: var(--secondary-text-color);
        white-space: pre-wrap;
        margin: 6px 4px 0;
      }
      #log {
        max-width: 1100px;
        max-height: 220px;
        overflow: auto;
        font-size: 12px;
        background: var(--secondary-background-color);
        padding: 8px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>Raffstore card – dev</strong>
      <label>Jazyk <select id="lang"><option value="sk">sk</option><option value="en">en</option><option value="cs">cs</option></select></label>
      <label>Téma <select id="theme"><option value="light">light</option><option value="dark">dark</option></select></label>
      <label><input type="checkbox" id="unavail" /> spálňa nedostupná</label>
    </div>
    <div id="cards"></div>
    <h4>Volania služieb</h4>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
